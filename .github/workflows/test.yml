name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run -p 3.12 --extra dev pytest -q
