name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q
