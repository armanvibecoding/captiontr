[project]
name = "caption-tr"
version = "0.2.0"
description = "Kısa dikey videolardaki gömülü yazıları bul, sil ve aynı stilde Türkçesini bas; metadata'yı temizle"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2026.1.1",
  "opencv-python-headless>=4.9",
  "numpy",
  "Pillow>=10",
  "imageio-ffmpeg",
  "pyobjc-framework-Vision; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/armanvibecoding/caption-tr"

[project.scripts]
reeltr = "reeltr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reeltr"]

[tool.setuptools.package-data]
reeltr = ["varliklar/*.ttf", "varliklar/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
